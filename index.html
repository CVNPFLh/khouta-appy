<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق خُطى - النسخة المحسنة الشاملة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #070a12; /* أسود ملكي عميق */
            --card-bg: #111827; /* رمادي داكن فاخر للكروت */
            --accent-gold: #d4af37; /* لون ذهبي ملكي براق */
            --accent-glow: rgba(212, 175, 55, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 95px;
            min-height: 100vh;
        }

        /* الهيدر العلوي الملكي المحسن */
        header {
            background: linear-gradient(180deg, #111827, #070a12);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-gold);
            box-shadow: 0 4px 25px var(--accent-glow);
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Cairo', sans-serif;
            font-size: 38px;
            color: var(--accent-gold);
            font-weight: 800;
            text-shadow: 0 0 15px var(--accent-glow);
            margin-bottom: 5px;
        }

        /* حاوية التاريخ الهجري المحسنة */
        .date-container {
            font-size: 14px;
            margin-top: 8px;
        }

        .date-badge {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(17, 24, 39, 0.8));
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 16px;
            border-radius: 50px;
            color: var(--accent-gold);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .date-badge i {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 19px;
            color: var(--accent-gold);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .premium-card {
            background-color: var(--card-bg);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            text-align: right;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-dark);
            color: var(--accent-gold);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        /* تحسين مشغل المصحف الصوتي */
        .audio-player-wrapper {
            background: #1f2937;
            padding: 12px;
            border-radius: 14px;
            margin-top: 15px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        audio {
            width: 100%;
            display: block;
            accent-color: var(--accent-gold);
        }

        /* تحسين خط وتصميم قسم قراءة القرآن الكريم المكتوب كاملاً */
        .quran-text-area {
            background-color: #151c2c;
            border-radius: 16px;
            padding: 25px 22px;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid rgba(212, 175, 55, 0.3);
            text-align: center;
            font-size: 25px; /* تكبير الخط لراحة العين */
            line-height: 2.4;
            color: #fcf8f2; /* لون مريح جداً للقراءة الطويلة */
            font-family: 'Amiri', serif; /* الخط المصحفي المعتمد */
            font-weight: 700;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.7);
            text-shadow: 0 1px 1px rgba(0,0,0,0.5);
        }

        /* تلوين أرقام الآيات بالذهبي */
        .quran-text-area .ayah-num {
            color: var(--accent-gold);
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            margin: 0 4px;
            font-weight: bold;
        }

        /* المسبحة الذكية */
        .tasbih-wrapper {
            text-align: center;
            padding: 10px 0;
        }

        .tasbih-display {
            font-size: 52px;
            color: var(--accent-gold);
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .tasbih-target {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: 600;
        }
