<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق خُطى - Khouta App Premium</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #070a12;
            --bg-card: #111827;
            --color-gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            padding-bottom: 95px;
            min-height: 100vh;
        }

        /* App Header Style */
        .app-header {
            background: linear-gradient(180deg, #111827, #070a12);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid var(--color-gold);
            box-shadow: 0 4px 25px var(--gold-glow);
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            margin-bottom: 20px;
        }

        .app-header h1 {
            font-size: 38px;
            color: var(--color-gold);
            font-weight: 800;
            text-shadow: 0 0 15px var(--gold-glow);
            margin-bottom: 5px;
        }

        /* Hijri Date Box Style */
        .date-container {
            font-size: 14px;
            margin-top: 8px;
        }

        .hijri-badge {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(17, 24, 39, 0.8));
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 16px;
            border-radius: 50px;
            color: var(--color-gold);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .hijri-badge i {
            animation: iconPulse 2s infinite;
        }

        @keyframes iconPulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .main-container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .app-page {
            display: none;
        }

        .app-page.active-page {
            display: block;
            animation: viewFadeIn 0.4s ease-in-out;
        }

        @keyframes viewFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-title {
            font-size: 19px;
            color: var(--color-gold);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .premium-card {
            background-color: var(--bg-card);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            text-align: right;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .custom-select {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-main);
            color: var(--color-gold);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        /* Audio Wrapper Custom Style */
        .audio-wrapper {
            background: #1f2937;
            padding: 12px;
            border-radius: 14px;
            margin-top: 15px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        audio {
            width: 100%;
            display: block;
            accent-color: var(--color-gold);
        }

        /* Full Quran Reader Style */
        .quran-text-viewer {
            background-color: #151c2c;
            border-radius: 16px;
            padding: 25px 22px;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid rgba(212, 175, 55, 0.3);
            text-align: center;
            font-size: 25px;
            line-height: 2.4;
            color: #fcf8f2;
            font-family: 'Amiri', serif;
            font-weight: 700;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.7);
            text-shadow: 0 1px 1px rgba(0,0,0,0.5);
        }

        .quran-text-viewer .ayah-number {
            color: var(--color-gold);
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            margin: 0 4px;
            font-weight: bold;
        }

        /* Smart Tasbih Counter Style */
        .tasbih-container {
            text-align: center;
            padding: 10px 0;
        }

        .counter-display {
            font-size: 54px;
            color: var(--color-gold);
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .tasbih-text {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .clicker-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #1f2937 0%, #111827 100%);
            border: 3px solid var(--color-gold);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: var(--color-gold);
            cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
            transition: all 0.1s ease;
        }

        .clicker-button:active {
            transform: scale(0.93);
            background: var(--color-gold);
            color: var(--bg-main);
        }

        .reset-button {
            background: none;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 18px;
            cursor: pointer;
        }

        /* Generic Text Cards Style */
        .info-card {
            background-color: var(--bg-card);
            border-right: 4px solid var(--color-gold);
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .info-card h4 {
            color: var(--color-gold);
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: 600;
        }

        .info-card p {
            font-size: 15px;
            line-height: 1.7;
            text-align: justify;
        }

        /* Navigation Bottom Bar Style */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-card);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 2px solid var(--color-gold);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 1000;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
            background: none;
            border: none;
            width: 20%;
            font-weight: 600;
        }

        .nav-link i {
            font-size: 20px;
            margin-bottom: 5px;
            transition: all 0.2s ease;
        }

        .nav-link.active-link {
            color: var(--color-gold);
        }

        .nav-link.active-link i {
            transform: translateY(-3px);
            text-shadow: 0 0 12px var(--gold-glow);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>خُطى</h1>
        <div class="date-container">
            <span class="hijri-badge" id="hijriDisplayElement"><i class="fa-solid fa-calendar-days"></i> جاري تحديث التقويم الهجري...</span>
        </div>
    </header>

    <div class="main-container">
        
        <div id="quranAudioPage" class="app-page active-page">
            <div class="content-title"><i class="fa-solid fa-volume-high"></i> الاستماع للمصحف الشريف</div>
            <div class="premium-card">
                <div class="form-group">
                    <label>اختر القارئ المفضل:</label>
                    <select id="reciterSelectElement" onchange="handleAudioChange()">
                        <option value="https://server8.mp3quran.net/afs/">مشاري العفاسي</option>
                        <option value="https://server11.mp3quran.net/muaiqly/">ماهر المعيقلي</option>
                        <option value="https://server10.mp3quran.net/basit_mjwd/">عبد الباسط عبد الصمد</option>
                        <option value="https://server12.mp3quran.net/minsh/">محمد صديق المنشاوي</option>
                        <option value="https://server6.mp3quran.net/shur/">سعود الشريم</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>اختر السورة:</label>
                    <select id="surahAudioSelectElement" onchange="handleAudioChange()">
                        <option value="001">1. الفاتحة</option>
                        <option value="002">2. البقرة</option>
                        <option value="003">3. آل عمران</option>
                        <option value="018">
